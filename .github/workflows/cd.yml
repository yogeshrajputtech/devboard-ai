
name: CD

on:
  workflow_call:

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to AWS EC2
    runs-on: self-hosted

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Verify Production Environment
        run: |
          test -f /opt/devboard-ai/.env
          echo "Production environment file found."

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Validate Docker Compose
        run: |
          docker compose \
            --env-file /opt/devboard-ai/.env \
            config --quiet

      - name: Pull Latest Images
        run: |
          docker compose \
            --env-file /opt/devboard-ai/.env \
            pull

      - name: Deploy Application
        run: |
          docker compose \
            --env-file /opt/devboard-ai/.env \
            up -d --remove-orphans

      - name: Verify Containers
        run: |
          docker compose \
            --env-file /opt/devboard-ai/.env \
            ps
